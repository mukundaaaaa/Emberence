<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Reviews | EMBERENCE DIGITAL</title>
  <meta name="description" content="Read what creators and brands say about working with Emberence Digital.">
  <meta name="theme-color" content="#171A1C">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
/* EMBERENCE DIGITAL: all reviews page (same design system as the homepage) */
:root {
  --dark: #171A1C; --lime: #B8F34A; --off-white: #F5F5F2;
  --text: #30363B; --muted: #777777; --white: #ffffff;
  --line: rgba(23, 26, 28, .1); --line-dark: rgba(245, 245, 242, .14);
  --font-head: 'Manrope', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --radius: 10px; --header-h: 72px; --ease: .2s ease;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font-family: var(--font-body); font-size: 1rem; line-height: 1.7; color: var(--text); background: var(--off-white); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; margin: 0; padding: 0; }
h1, h2, h3 { font-family: var(--font-head); color: var(--dark); line-height: 1.15; margin: 0; letter-spacing: -.02em; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; border-radius: 4px; }
.container { width: min(1160px, 100% - 3rem); margin-inline: auto; }

.btn { display: inline-flex; align-items: center; justify-content: center; padding: .95rem 1.8rem; border-radius: 8px; border: 1.5px solid transparent; font: 600 .98rem/1 var(--font-head); cursor: pointer; transition: background var(--ease), color var(--ease), transform var(--ease); }
.btn-sm { padding: .7rem 1.2rem; font-size: .9rem; }
.btn-primary { background: var(--lime); color: var(--dark); }
.btn-primary:hover { background: var(--off-white); transform: translateY(-1px); }
.btn-dark { background: var(--dark); color: var(--off-white); }
.btn-dark:hover { background: var(--text); transform: translateY(-1px); }
.btn[disabled] { opacity: .6; cursor: not-allowed; transform: none; }
.text-link { font: 600 .92rem var(--font-head); color: var(--dark); border-bottom: 2px solid var(--lime); padding-bottom: 2px; transition: border-color var(--ease); }
.text-link:hover { border-color: var(--dark); }

/* Header */
.site-header { position: sticky; top: 0; z-index: 100; height: var(--header-h); background: var(--dark); border-bottom: 1px solid var(--line-dark); }
.nav { height: 100%; display: flex; align-items: center; justify-content: space-between; }
.brand { display: inline-flex; align-items: center; gap: .7rem; color: var(--off-white); }
.brand img { display: block; height: 36px; width: auto; }
.brand-text { display: flex; flex-direction: column; line-height: 1; }
.brand-name { font: 800 1.2rem var(--font-head); letter-spacing: .08em; }
.brand-sub { font: 600 .62rem var(--font-head); letter-spacing: .5em; color: var(--lime); margin-top: .3rem; }
.nav-links { display: flex; align-items: center; gap: 1.6rem; }
.nav-links > a:not(.btn) { font: 500 .94rem var(--font-body); color: rgba(245, 245, 242, .75); transition: color var(--ease); }
.nav-links > a:not(.btn):hover { color: var(--off-white); }

/* Page */
main { padding: clamp(3rem, 7vw, 5.5rem) 0; }
.page-head { max-width: 38rem; margin-bottom: clamp(2rem, 4vw, 3rem); }
.page-head h1 { margin-top: 1.4rem; font-size: clamp(2.2rem, 5vw, 3.2rem); font-weight: 800; }
.page-head p { margin-top: .9rem; font-size: 1.1rem; color: var(--muted); }
.grid { display: grid; gap: 1.5rem; }
.review-layout { display: grid; gap: 1.5rem; }
.review-grid { grid-template-columns: repeat(4, 1fr); gap: 1.1rem; }
.more-row { display: flex; justify-content: center; margin-top: 1rem; }
.status { padding: 2rem 0; color: var(--muted); }

/* Score bar */
.review-score { display: grid; grid-template-columns: auto minmax(0, 460px); justify-content: space-between; align-items: center; gap: 1.5rem 4rem; padding: 2rem 2.4rem; background: var(--dark); color: var(--off-white); border-radius: 16px; }
.score-num { font: 800 4.2rem/1 var(--font-head); letter-spacing: -.04em; color: var(--off-white); }
.score-stars { margin-top: .7rem; font-size: 1.3rem; letter-spacing: .15em; color: var(--lime); }
.score-count { margin-top: .4rem; font-size: .95rem; color: rgba(245, 245, 242, .65); }
.score-bars { display: grid; gap: .5rem; }
.score-bars li { display: grid; grid-template-columns: 1rem 1fr 1.5rem; align-items: center; gap: .7rem; font-size: .85rem; color: rgba(245, 245, 242, .75); }
.score-bars .track { height: 6px; border-radius: 3px; background: rgba(245, 245, 242, .14); overflow: hidden; }
.score-bars .track i { display: block; height: 100%; border-radius: 3px; background: var(--lime); }
.score-bars .n { text-align: right; }

/* Review cards */
.card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 2rem 1.6rem; display: flex; flex-direction: column; align-items: flex-start; transition: border-color var(--ease), transform var(--ease); }
.card:hover { border-color: var(--dark); transform: translateY(-3px); }
.card .stars { flex: none; margin-bottom: 1rem; font-size: 1.15rem; letter-spacing: .15em; color: var(--dark); }
.card .review-title { font-size: 1.05rem; margin: 0 0 .5rem; overflow-wrap: anywhere; }
.card .review-text { flex: none; margin-bottom: .6rem; font-size: .95rem; white-space: pre-line; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.card .reviewer { flex: none; margin: auto 0 0; font: 700 .95rem var(--font-head); color: var(--dark); }
.read-more { align-self: flex-start; margin: 0 0 1.4rem; padding: 0 0 2px; background: none; border: 0; border-bottom: 2px solid var(--lime); cursor: pointer; font: 600 .92rem var(--font-head); color: var(--dark); transition: border-color var(--ease); }
.read-more:hover { border-color: var(--dark); }
.verified { display: inline-block; margin-left: .5rem; padding: .1rem .55rem; border-radius: 999px; background: var(--dark); color: var(--lime); font: 600 .72rem var(--font-head); vertical-align: middle; }

/* Compact review cards (4 per row, 2 lines of text) */
.card { padding: 1.2rem 1.1rem; }
.card .stars { margin-bottom: .5rem; font-size: 1rem; }
.card .review-title { margin-bottom: .3rem; font-size: .98rem; line-height: 1.3; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.card .review-text { margin-bottom: .4rem; font-size: .88rem; line-height: 1.55; }
.read-more { margin-bottom: .2rem; font-size: .85rem; }
.card .reviewer { padding-top: .8rem; font-size: .9rem; line-height: 1.4; }
.card .verified { display: block; width: fit-content; margin: .3rem 0 0; }

/* Full review popup */
.review-modal { width: min(560px, 100% - 2rem); max-height: 85vh; padding: 0; border: 0; border-radius: 14px; background: var(--white); color: var(--text); overflow: auto; }
.review-modal::backdrop { background: rgba(23, 26, 28, .65); }
.rm-inner { padding: clamp(1.5rem, 4vw, 2.2rem); }
.rm-close { position: absolute; top: .6rem; right: .6rem; width: 40px; height: 40px; border: 0; border-radius: 8px; background: none; cursor: pointer; font-size: 1.6rem; line-height: 1; color: var(--dark); }
.rm-close:hover { background: var(--off-white); }
.rm-stars { margin-bottom: 1rem; font-size: 1.15rem; letter-spacing: .15em; color: var(--dark); }
.rm-title { font-size: 1.25rem; margin-bottom: .6rem; overflow-wrap: anywhere; }
.rm-body { white-space: pre-line; overflow-wrap: anywhere; }
.rm-reply { margin-top: 1.5rem; padding: .9rem 1.1rem; border-left: 3px solid var(--lime); background: var(--off-white); border-radius: 0 8px 8px 0; font-size: .95rem; }
.rm-reply strong { display: block; font: 700 .9rem var(--font-head); color: var(--dark); margin-bottom: .2rem; }
.rm-reply p { white-space: pre-line; overflow-wrap: anywhere; }
.rm-who { margin-top: 1.5rem; font: 700 .95rem var(--font-head); color: var(--dark); }

/* Footer */
.footer { background: var(--dark); color: rgba(245, 245, 242, .7); padding: 1.5rem 0; font-size: .88rem; }
.footer .container { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; }
.footer a:hover { color: var(--lime); }

@media (max-width: 1024px) { .review-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 860px) { .review-score { grid-template-columns: 1fr; } }
@media (max-width: 640px) {
  .container { width: min(1160px, 100% - 2.25rem); }
  .review-grid { grid-template-columns: 1fr; }
  .nav-links { gap: 1rem; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  
  /* Lime stars on review cards and in the popup */
.card .stars,
.rm-stars { color: #9dff00;; }

  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html" aria-label="Emberence Digital, home">
        <img src="emberence-creative-logo.png" alt="" width="34" height="36">
        <span class="brand-text"><span class="brand-name">EMBERENCE</span><span class="brand-sub">DIGITAL</span></span>
      </a>
      <nav class="nav-links" aria-label="Main">
        <a href="index.html">Home</a>
        <a class="btn btn-primary btn-sm" href="quote.html">Get a Quote</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-head">
        <a class="text-link" href="index.html#review">Back to home</a>
        <h1>Client reviews</h1>
        <p>Every review here comes from a real client.</p>
      </div>

      <p class="status" id="status" role="status">Loading reviews...</p>

      <div class="review-layout" id="review-layout" hidden>
        <aside class="review-score" aria-label="Rating summary">
          <div class="score-main">
            <p class="score-num" id="score-num"></p>
            <p class="score-stars" id="score-stars" role="img"></p>
            <p class="score-count" id="score-count"></p>
          </div>
          <ul class="score-bars" id="score-bars"></ul>
        </aside>
        <div class="grid review-grid" id="review-grid"></div>
        <div class="more-row"><button class="btn btn-dark" type="button" id="load-more" hidden>Load more reviews</button></div>
      </div>

      <dialog class="review-modal" id="review-modal" aria-labelledby="rm-name">
        <button class="rm-close" type="button" id="rm-close" aria-label="Close review">&times;</button>
        <div class="rm-inner">
          <p class="rm-stars" id="rm-stars" role="img"></p>
          <h3 class="rm-title" id="rm-title"></h3>
          <p class="rm-body" id="rm-body"></p>
          <div class="rm-reply" id="rm-reply"><strong>Reply from Emberence</strong><p id="rm-reply-text"></p></div>
          <p class="rm-who" id="rm-name"></p>
        </div>
      </dialog>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year">2026</span> Emberence Digital. All rights reserved.</p>
      <a href="index.html">Back to home</a>
    </div>
  </footer>

  <script>
/* EMBERENCE DIGITAL: all reviews page (vanilla JS). Reviews are built with textContent, so review text can never inject HTML. */
(function () {
  'use strict';

  /* Keep this path matching where you upload api/reviews.php */
  var API = 'api/reviews.php';
  var PAGE_SIZE = 12;

  var $ = function (id) { return document.getElementById(id); };
  var grid = $('review-grid'), layout = $('review-layout'), statusBox = $('status'), moreBtn = $('load-more');
  var offset = 0, total = 0, loading = false;

  var el = function (tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  };
  var starText = function (n) { return '\u2605\u2605\u2605\u2605\u2605\u2606\u2606\u2606\u2606\u2606'.slice(5 - n, 10 - n); };

  /* "Read more" shows only when the text is cut off, or when there is a reply from us to read */
  function checkMore() {
    grid.querySelectorAll('.card').forEach(function (c) {
      var t = c.querySelector('.review-text'), b = c.querySelector('.read-more');
      if (t && b) b.hidden = !(c.dataset.reply || t.scrollHeight > t.clientHeight + 1);
    });
  }
  var resizeTimer;
  window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(checkMore, 150); });

  /* Full review popup */
  var modal = $('review-modal');
  function openReview(rv) {
    var stars = $('rm-stars');
    stars.textContent = starText(rv.rating);
    stars.setAttribute('aria-label', rv.rating + ' out of 5 stars');
    var title = $('rm-title');
    title.textContent = rv.title; title.hidden = !rv.title;
    $('rm-body').textContent = rv.body;
    $('rm-reply').hidden = !rv.reply;
    $('rm-reply-text').textContent = rv.reply || '';
    var who = $('rm-name');
    who.textContent = rv.name + ' ';
    who.appendChild(el('span', 'verified', '\u2713 Verified client'));
    modal.showModal();
  }
  $('rm-close').addEventListener('click', function () { modal.close(); });
  modal.addEventListener('click', function (e) { if (e.target === modal) modal.close(); });

  function renderScore(d) {
    $('score-num').textContent = d.average.toFixed(1);
    var avg = $('score-stars');
    avg.textContent = starText(Math.round(d.average));
    avg.setAttribute('aria-label', d.average.toFixed(1) + ' out of 5 stars');
    $('score-count').textContent = 'Based on ' + d.count + (d.count === 1 ? ' review' : ' reviews');
    var bars = $('score-bars');
    bars.textContent = '';
    for (var star = 5; star >= 1; star--) {
      var n = (d.distribution && d.distribution[star]) || 0;
      var row = el('li');
      row.appendChild(el('span', '', String(star)));
      var track = el('span', 'track'), fill = el('i');
      fill.style.width = (d.count ? Math.round(n / d.count * 100) : 0) + '%';
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el('span', 'n', String(n)));
      bars.appendChild(row);
    }
  }

  function renderCard(rv) {
    var card = el('article', 'card');
    var stars = el('p', 'stars', starText(rv.rating));
    stars.setAttribute('role', 'img');
    stars.setAttribute('aria-label', rv.rating + ' out of 5 stars');
    card.appendChild(stars);
    if (rv.title) card.appendChild(el('h3', 'review-title', rv.title));
    card.appendChild(el('p', 'review-text', rv.body));
    var more = el('button', 'read-more', 'Read more');
    more.type = 'button';
    more.hidden = true;
    more.setAttribute('aria-haspopup', 'dialog');
    more.addEventListener('click', function () { openReview(rv); });
    card.appendChild(more);
    if (rv.reply) card.dataset.reply = '1';
    var who = el('p', 'reviewer', rv.name);
    who.appendChild(el('span', 'verified', '\u2713 Verified client'));
    card.appendChild(who);
    grid.appendChild(card);
  }

  function load() {
    if (loading) return;
    loading = true;
    moreBtn.disabled = true;

    fetch(API + '?limit=' + PAGE_SIZE + '&offset=' + offset, { headers: { Accept: 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        loading = false;
        moreBtn.disabled = false;
        if (!d || d.result !== 'ok') { statusBox.textContent = 'Reviews could not be loaded right now. Please try again in a moment.'; statusBox.hidden = false; return; }
        if (!d.reviews.length && offset === 0) {
          statusBox.textContent = 'No reviews yet. Reviews from our clients will appear here.';
          statusBox.hidden = false;
          return;
        }
        statusBox.hidden = true;
        layout.hidden = false;
        total = d.count;
        if (offset === 0) renderScore(d);
        d.reviews.forEach(renderCard);
        offset += d.reviews.length;
        moreBtn.hidden = offset >= total || !d.reviews.length;
        checkMore();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(checkMore);
      })
      .catch(function () {
        loading = false;
        moreBtn.disabled = false;
        statusBox.textContent = 'Reviews could not be loaded right now. Please try again in a moment.';
        statusBox.hidden = false;
      });
  }

  moreBtn.addEventListener('click', load);
  $('year').textContent = new Date().getFullYear();
  load();
})();
  </script>
</body>
</html>
